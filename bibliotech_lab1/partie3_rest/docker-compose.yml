version: '3.8'
services:
  db:
    image: postgres
    container_name: library_db
    environment:
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library
      POSTGRES_DB: library
    ports:
      - "5432:5432"
    volumes:
      - ~/data:/var/lib/postgresql/data

  api:
    build: .
    container_name: library_api
    environment:
      DATABASE_URL: postgresql://library:library@db:5432/library
    ports:
      - "8000:8000"
    depends_on:
      - db
